name: Release EmbyMissingSubscribe

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins.v2/embymissingsubscribe/**"
      - "package.json"
      - "package.v2.json"
      - ".github/workflows/release-embymissingsubscribe.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0
      PLUGIN_DIR: plugins.v2/embymissingsubscribe
    steps:
      - uses: actions/checkout@v5
      - name: Validate plugin
        run: |
          test -f "$PLUGIN_DIR/__init__.py"
          test -f "$PLUGIN_DIR/pyproject.toml"
          test -f "$PLUGIN_DIR/requirements.txt"
          python3 -m compileall -q "$PLUGIN_DIR"
      - name: Package plugin
        run: |
          mkdir -p release/embymissingsubscribe
          cp -a "$PLUGIN_DIR/." release/embymissingsubscribe/
          cd release
          zip -qr "../embymissingsubscribe_v${VERSION}.zip" embymissingsubscribe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "EmbyMissingSubscribe_v${VERSION}" "embymissingsubscribe_v${VERSION}.zip" \
            --title "EmbyMissingSubscribe v${VERSION}" \
            --notes "首发版：扫描 Emby 电视剧缺集，按季创建 MoviePilot 订阅，支持定时与立即扫描。" \
            --latest
