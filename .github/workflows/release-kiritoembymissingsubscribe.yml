name: Release KiritoEmbyMissingSubscribe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugins.v2/kiritoembymissingsubscribe/**"
      - "package.json"
      - "package.v2.json"
      - ".github/workflows/release-kiritoembymissingsubscribe.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.16
      PLUGIN_DIR: plugins.v2/kiritoembymissingsubscribe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: ${{ env.PLUGIN_DIR }}/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate plugin
        run: |
          test -f "$PLUGIN_DIR/__init__.py"
          test -f "$PLUGIN_DIR/pyproject.toml"
          test -f "$PLUGIN_DIR/requirements.txt"
          grep -q "plugin_version = \"$VERSION\"" "$PLUGIN_DIR/__init__.py"
          grep -q "version = \"$VERSION\"" "$PLUGIN_DIR/pyproject.toml"
          python3 -m compileall -q "$PLUGIN_DIR"
      - name: Package plugin
        run: |
          mkdir -p release/kiritoembymissingsubscribe
          rsync -a --exclude 'node_modules' --exclude '*.tsbuildinfo' "$PLUGIN_DIR/" release/kiritoembymissingsubscribe/
          cd release
          zip -qr "../kiritoembymissingsubscribe_v${VERSION}.zip" kiritoembymissingsubscribe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="KiritoEmbyMissingSubscribe_v${VERSION}"
          ASSET="kiritoembymissingsubscribe_v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "KiritoEmbyMissingSubscribe v${VERSION}" \
              --notes "每次扫描完成都发送结果通知，无新订阅时也明确提醒扫描无变化。" \
              --latest
          fi
