name: Release KiritoP115StrmHelper

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins.v2/kiritop115strmhelper/**"
      - "package.json"
      - "package.v2.json"
      - ".github/workflows/release-kiritop115strmhelper.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: plugins.v2/kiritop115strmhelper
      VERSION: 2.8.78
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip maturin==1.10.2
      - name: Build CPython 3.14 Linux wheels
        run: |
          # Keep the checked-in cp312 wheels for older MoviePilot images.
          # Only remove stale cp314 builds before rebuilding the current runtime.
          find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f -name '*cp314*' -delete
          mkdir -p "$PLUGIN_DIR/wheels"
          for crate in full_strm_sync txt_tree_storage share_strm_scan; do
            maturin build --release --interpreter python3.14 --out "$PLUGIN_DIR/wheels" --manifest-path "$PLUGIN_DIR/rust_utils/$crate/Cargo.toml"
          done
          python -m pip wheel --no-deps --wheel-dir "$PLUGIN_DIR/wheels" 'pyahocorasick~=2.3.0'
          for wheel_package in full_strm_sync txt_tree_storage share_strm_scan; do
            test -n "$(find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f -name "${wheel_package}-*cp314*linux*" -print -quit)"
          done
          test -n "$(find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f -name 'pyahocorasick-*cp314*linux*' -print -quit)"
          for wheel_package in full_strm_sync txt_tree_storage share_strm_scan; do
            test -n "$(find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f -name "${wheel_package}-*cp312*linux*x86_64*" -print -quit)"
          done
          test -n "$(find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f -name 'pyahocorasick-*cp312*linux*x86_64*' -print -quit)"
          # Keep only Linux wheels in the release bundle. The plugin runs in
          # Linux containers; macOS/Windows wheels only add noise and size.
          find "$PLUGIN_DIR/wheels" -maxdepth 1 -type f ! -name '*linux*' -delete
      - name: Package plugin
        run: |
          mkdir -p release/kiritop115strmhelper
          rsync -a --exclude rust_utils "$PLUGIN_DIR/" release/kiritop115strmhelper/
          cd release
          zip -qr "../kiritop115strmhelper_v${VERSION}.zip" kiritop115strmhelper
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "KiritoP115StrmHelper_v${VERSION}" "kiritop115strmhelper_v${VERSION}.zip" \
            --title "KiritoP115StrmHelper v${VERSION}" \
            --notes "兼容 MoviePilot V3 storage/list 目录响应，修复选择本地目录提示无效响应；同时保留 Python 3.12/3.14 依赖包。" \
            --latest
